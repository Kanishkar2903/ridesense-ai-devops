global:
  resolve_timeout: 1m

route:
  receiver: "ridesense-discord"
  group_by:
    - alertname

  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: "ridesense-discord"

    webhook_configs:
      - url: "http://host.docker.internal:9094/alerts"
        send_resolved: true